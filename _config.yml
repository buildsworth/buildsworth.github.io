# Keep the legacy branch-based Pages Jekyll job from parsing Astro sources.
# After switching Pages → Source: GitHub Actions, this file is unused.
exclude:
  - src
  - scripts
  - resource
  - node_modules
  - public
  - dist
  - .astro
  - .github
  - package.json
  - package-lock.json
  - astro.config.mjs
  - tsconfig.json
  - netlify.toml
  - PERFORMANCE.md
  - README.md
  - LICENSE
  - vendor
